<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Campus Connect – TMU</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent:     #FFB106;       /* TMU Amber — main brand colour   */
      --accent2:    #e69500;       /* Deeper amber for hover/gradient  */
      --accent-red: #C0392B;       /* TMU red from logo ring           */
      --bg:         #F5F2EB;       /* Cloudy white — main background   */
      --bg2:        #FFFFFF;       /* Pure white — input & cards       */
      --border:     rgba(220,180,50,0.25);
      --text:       #2D1A00;       /* Dark brown — readable on white   */
      --text-muted: #7A5C1E;       /* Muted amber-brown                */
      --radius:     16px;
    }

    html {
      /* Fix for mobile browser chrome eating viewport */
      height: -webkit-fill-available;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      /* Use dvh (dynamic viewport height) with fallback for older browsers */
      height: 100vh;
      height: 100dvh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      /* Safe area inset for notched phones */
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* ── Chat Header ── */
    .chat-header {
      background: linear-gradient(135deg, #FFB106 0%, #e69500 60%, #c97d00 100%);
      padding: 14px 16px;
      display: flex; align-items: center; gap: 10px;
      border-radius: var(--radius) var(--radius) 0 0;
      flex-shrink: 0;
      box-shadow: 0 2px 10px rgba(255,177,6,0.3);
    }
    .header-avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: #fff;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      padding: 2px;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.4);
    }
    .header-avatar img {
      width: 100%; height: 100%;
      object-fit: contain; border-radius: 50%;
    }
    .header-info { flex: 1; }
    .header-name { font-size: 14px; font-weight: 600; color: #fff; }
    .header-status {
      font-size: 11px; color: rgba(255,255,255,0.8);
      display: flex; align-items: center; gap: 4px;
    }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #4ade80; display: inline-block; }

    /* ── Messages Area ── */
    .chat-messages {
      flex: 1; overflow-y: auto;
      padding: 16px; display: flex; flex-direction: column; gap: 12px;
      background: var(--bg);
      scrollbar-width: thin; scrollbar-color: rgba(255,177,6,0.2) transparent;
    }
    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-thumb { background: rgba(255,177,6,0.3); border-radius: 2px; }

    /* ── Message Bubbles ── */
    .msg { display: flex; align-items: flex-end; gap: 8px; max-width: 88%; animation: msgIn 0.25s ease; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.bot  { align-self: flex-start; }
    @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .msg-avatar {
      width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 14px;
    }
    .bot .msg-avatar {
      background: #fff;
      padding: 2px;
      overflow: hidden;
    }
    .bot .msg-avatar img { width: 100%; height: 100%; object-fit: contain; border-radius: 50%; }
    .user .msg-avatar { background: rgba(255,179,6,0.15); font-size: 14px; }

    .msg-bubble {
      padding: 10px 14px; border-radius: 14px;
      font-size: 13px; line-height: 1.55;
    }
    .bot .msg-bubble {
      background: #FFFFFF;
      border: 1px solid rgba(255,177,6,0.2);
      color: var(--text);
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .user .msg-bubble {
      background: linear-gradient(135deg, #FFB106, #e69500);
      color: #fff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 2px 8px rgba(255,177,6,0.35);
    }

    .msg-sources {
      margin-top: 6px; font-size: 11px; color: var(--text-muted);
      font-style: italic;
    }

    /* Typing indicator */
    .typing-indicator { display: flex; gap: 4px; padding: 12px 14px; }
    .typing-dot {
      width: 7px; height: 7px; background: var(--accent);
      border-radius: 50%;
      animation: typing 1.2s ease-in-out infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing { 0%, 80%, 100% { transform: scale(0.7); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }

    /* ── Suggestions ── */
    .suggestions {
      padding: 8px 16px 0;
      display: flex; flex-wrap: wrap; gap: 6px;
      background: var(--bg); flex-shrink: 0;
    }
    .suggestion-chip {
      padding: 5px 12px;
      border: 1.5px solid var(--accent);
      border-radius: 20px; background: rgba(255,177,6,0.10);
      color: #7A4500; font-size: 12px; cursor: pointer;
      font-family: inherit; transition: all 0.2s;
      font-weight: 500;
    }
    .suggestion-chip:hover { background: var(--accent); color: #fff; }

    /* ── Input Bar ── */
    .chat-input-bar {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 14px;
      background: var(--bg2);
      border-top: 1.5px solid rgba(255,177,6,0.2);
      flex-shrink: 0;
    }
    .chat-input {
      flex: 1; background: var(--bg);
      border: 1.5px solid rgba(255,177,6,0.3);
      border-radius: 24px; padding: 9px 16px;
      color: var(--text); font-size: 13px; font-family: inherit;
      outline: none; transition: border-color 0.2s;
      resize: none; max-height: 90px; overflow-y: auto;
    }
    .chat-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,177,6,0.15); }
    .chat-input::placeholder { color: var(--text-muted); }
    .send-btn {
      width: 38px; height: 38px; border-radius: 50%;
      background: linear-gradient(135deg, #C0392B, #FFB106);
      border: none; cursor: pointer; font-size: 16px;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(192,57,43,0.4);
    }
    .send-btn:hover { opacity: 0.9; transform: scale(1.08); box-shadow: 0 4px 14px rgba(192,57,43,0.5); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

    /* Welcome message */
    .welcome {
      text-align: center; padding: 20px 16px;
      color: var(--text-muted);
    }
    .welcome-icon { font-size: 40px; margin-bottom: 12px; }
    .welcome-title { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
    .welcome-sub { font-size: 12px; line-height: 1.6; color: var(--text-muted); }

    /* Clickable links inside bot messages */
    .chat-link {
      display: inline-flex; align-items: center; gap: 4px;
      color: #7A4500; text-decoration: none;
      background: rgba(255,177,6,0.12);
      border: 1px solid rgba(255,177,6,0.35);
      border-radius: 20px;
      padding: 3px 10px; margin: 2px 0;
      font-size: 13px; font-weight: 500;
      transition: background 0.2s;
      word-break: break-all;
    }
    .chat-link:hover, .chat-link:active {
      background: rgba(255,177,6,0.25); color: #5A3000;
    }

    /* Reset chat tab in header */
    .reset-chat-tab {
      background: rgba(255,255,255,0.25);
      border: 1.5px solid rgba(255,255,255,0.5);
      border-radius: 20px;
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 6px 12px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .reset-chat-tab:hover {
      background: rgba(255,255,255,0.4);
    }
    .reset-chat-tab:active {
      transform: scale(0.95);
    }

    /* Long-press admin hint */
    .header-avatar {
      position: relative;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }
    .long-press-ring {
      position: absolute; inset: -4px;
      border: 2px solid rgba(255,255,255,0.6);
      border-radius: 50%;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .header-avatar.pressing .long-press-ring {
      opacity: 1;
      animation: ring-grow 0.8s linear forwards;
    }
    @keyframes ring-grow {
      from { transform: scale(0.5); opacity: 1; }
      to   { transform: scale(1.3); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="chat-header">
    <div class="header-avatar" id="header-avatar">
      <img src="/widget/tmu-logo.png"
           onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 40 40%22><circle cx=%2220%22 cy=%2220%22 r=%2220%22 fill=%22%23FFB106%22/><text x=%2250%%22 y=%2256%%22 text-anchor=%22middle%22 font-family=%22Arial%22 font-weight=%22bold%22 font-size=%2212%22 fill=%22white%22>TMU</text></svg>';"
           alt="TMU Logo" />
      <div class="long-press-ring"></div>
    </div>
    <div class="header-info">
      <div class="header-name" id="header-name">CAMPUS CONNECT</div>
      <div class="header-status"><span class="status-dot"></span> Online & Ready</div>
    </div>
    <button class="reset-chat-tab" id="restart-btn">Reset chat</button>
  </div>

  <div class="chat-messages" id="chat-messages">
    <div class="welcome">
      <div class="welcome-icon">
        <img src="/widget/tmu-logo.png"
             onerror="this.style.display='none';"
             alt="TMU" style="width:70px;height:70px;object-fit:contain;" />
      </div>
      <div class="welcome-title" id="welcome-title">Welcome to Campus Connect!</div>
      <div class="welcome-sub">Your AI assistant for Teerthanker Mahaveer University. Ask me anything about admissions, courses, faculty, campus life, and more.</div>
    </div>
  </div>

  <div class="suggestions" id="suggestions">
    <button class="suggestion-chip" data-q="What are the admission requirements?">Admissions</button>
    <button class="suggestion-chip" data-q="What courses are available?">Courses</button>
    <button class="suggestion-chip" data-q="What are the university timings?">Timings</button>
    <button class="suggestion-chip" data-q="How can I contact the admin office?">Contact</button>
  </div>

  <div class="chat-input-bar">
    <textarea class="chat-input" id="chat-input" placeholder="Ask a question about the university..." rows="1"></textarea>
    <button class="send-btn" id="send-btn" title="Send">➤</button>
  </div>

  <script>
    const API_URL = window.location.origin + '/api/chat';
    let sessionId = null;
    let isWaiting = false;

    // ── 15-Minute Inactivity Chat Clear ───────────────────────
    const CHAT_INACTIVITY_MS = 15 * 60 * 1000; // 15 minutes
    let chatInactivityTimer = null;

    function resetChatInactivityTimer() {
      clearTimeout(chatInactivityTimer);
      chatInactivityTimer = setTimeout(clearChatSession, CHAT_INACTIVITY_MS);
    }

    function clearChatSession() {
      // Reset session ID so backend treats next message as a new conversation
      sessionId = null;
      isWaiting = false;
      sendBtn.disabled = false;
      inputEl.value = '';
      inputEl.style.height = 'auto';
      
      // Clear all messages from the UI
      const messagesEl = document.getElementById('chat-messages');
      messagesEl.innerHTML = `
        <div class="welcome">
          <div class="welcome-icon">
            <img src="/widget/tmu-logo.png" alt="TMU" style="width:70px;height:70px;object-fit:contain;" />
          </div>
          <div class="welcome-title" id="welcome-title">Welcome to Campus Connect!</div>
          <div class="welcome-sub">Your AI assistant for Teerthanker Mahaveer University. Ask me anything about admissions, courses, faculty, campus life, and more.</div>
        </div>`;
      // Show suggestion chips again
      document.getElementById('suggestions').style.display = '';
      removeTyping();
      inputEl.focus();
    }

    const messagesEl = document.getElementById('chat-messages');
    const inputEl    = document.getElementById('chat-input');
    const sendBtn    = document.getElementById('send-btn');

    // ── Restart / Clear Chat Button ────────────────────────────
    document.getElementById('restart-btn').addEventListener('click', () => {
      if (!confirm('Clear chat and start over?')) return;
      clearChatSession();
      sessionId = null;
    });

    // ── Long-press hat icon → Admin Panel ─────────────────────
    const headerAvatar = document.getElementById('header-avatar');
    let longPressTimer = null;
    const LONG_PRESS_MS = 800;
    let touchStartPos = { x: 0, y: 0 };
    const TOUCH_MOVE_THRESHOLD = 10; // pixels

    function startLongPress() {
      headerAvatar.classList.add('pressing');
      longPressTimer = setTimeout(() => {
        headerAvatar.classList.remove('pressing');
        window.location.href = window.location.origin + '/panel/';
      }, LONG_PRESS_MS);
    }
    function cancelLongPress() {
      clearTimeout(longPressTimer);
      headerAvatar.classList.remove('pressing');
    }

    // Touch (mobile) with jitter handling
    headerAvatar.addEventListener('touchstart', e => {
      e.preventDefault();
      const touch = e.touches[0];
      touchStartPos = { x: touch.clientX, y: touch.clientY };
      startLongPress();
    }, { passive: false });
    headerAvatar.addEventListener('touchend',   cancelLongPress);
    headerAvatar.addEventListener('touchmove',  e => {
      const touch = e.touches[0];
      const dx = touch.clientX - touchStartPos.x;
      const dy = touch.clientY - touchStartPos.y;
      if (Math.sqrt(dx * dx + dy * dy) > TOUCH_MOVE_THRESHOLD) {
        cancelLongPress();
      }
    });
    // Mouse (desktop)
    headerAvatar.addEventListener('mousedown', startLongPress);
    headerAvatar.addEventListener('mouseup',   cancelLongPress);
    headerAvatar.addEventListener('mouseleave', cancelLongPress);
    // Prevent context menu on long press
    headerAvatar.addEventListener('contextmenu', e => e.preventDefault());

    // Auto-resize textarea
    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 90) + 'px';
    });

    // Send on Enter (Shift+Enter for newline)
    inputEl.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
    sendBtn.addEventListener('click', sendMessage);

    // Suggestion chips
    document.querySelectorAll('.suggestion-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        inputEl.value = chip.dataset.q;
        sendMessage();
        document.getElementById('suggestions').style.display = 'none';
      });
    });

    // Convert plain text URLs, phone numbers into tappable links
    function formatBotText(text) {
      // Escape HTML first
      let safe = text
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      // Google search links → show as clean "google.com" tap button
      safe = safe.replace(
        /(https?:\/\/www\.google\.com\/search\?[^\s\n<]+)/g,
        '<a href="$1" target="_blank" rel="noopener" class="chat-link">🔍 google.com</a>'
      );
      // All other http/https URLs → generic tap to open
      safe = safe.replace(
        /(https?:\/\/(?!www\.google\.com\/search)[^\s\n<]+)/g,
        '<a href="$1" target="_blank" rel="noopener" class="chat-link">🔗 Tap to open</a>'
      );
      // Make www. links clickable
      safe = safe.replace(
        /(?<![/"=])(www\.[a-zA-Z0-9.-]+\.[a-z]{2,}(?:\/[^\s]*)?)/g,
        '<a href="https://$1" target="_blank" rel="noopener" class="chat-link">🔗 $1</a>'
      );
      // Make phone numbers tappable (Indian format)
      safe = safe.replace(
        /(\b(?:\+91[\s-]?)?[6-9]\d{9}\b|1800[\s-]?\d{3}[\s-]?\d{4}\b)/g,
        '<a href="tel:$1" class="chat-link">📞 $1</a>'
      );
      // Newlines to <br>
      return safe.replace(/\n/g, '<br>');
    }

    function addMessage(role, text, sources = []) {
      const avatarHtml = role === 'bot'
        ? `<img src="/widget/tmu-logo.png" alt="TMU" onerror="this.parentElement.textContent='CC';" />`
        : '👤';
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      const content = role === 'bot' ? formatBotText(text) : text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
      div.innerHTML = `
        <div class="msg-avatar">${avatarHtml}</div>
        <div>
          <div class="msg-bubble">${content}</div>
          ${sources.length ? `<div class="msg-sources">📎 Sources: ${sources.join(', ')}</div>` : ''}
        </div>`;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    function showTyping() {
      const div = document.createElement('div');
      div.className = 'msg bot'; div.id = 'typing';
      div.innerHTML = `<div class="msg-avatar"><img src="/widget/tmu-logo.png" alt="TMU" onerror="this.parentElement.textContent='CC';" /></div>
        <div class="msg-bubble"><div class="typing-indicator">
          <div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>
        </div></div>`;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function removeTyping() {
      const t = document.getElementById('typing');
      if (t) t.remove();
    }

    async function sendMessage() {
      const question = inputEl.value.trim();
      if (!question || isWaiting) return;

      isWaiting = true;
      sendBtn.disabled = true;
      inputEl.value = '';
      inputEl.style.height = 'auto';
      document.getElementById('suggestions').style.display = 'none';

      addMessage('user', question);
      showTyping();
      resetChatInactivityTimer(); // Reset 15-min inactivity timer on each message

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question, session_id: sessionId })
        });

        if (!res.ok) throw new Error('Server error');
        const data = await res.json();
        sessionId = data.session_id;

        removeTyping();
        addMessage('bot', data.answer, data.sources || []);
      } catch (err) {
        removeTyping();
        addMessage('bot', '⚠️ I could not reach the server. Please try again in a moment.');
      } finally {
        isWaiting = false;
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    // Fetch university name from API and update header
    async function fetchConfig() {
      try {
        const res = await fetch(window.location.origin + '/api/health');
        if (res.ok) {
          // Could extend to fetch university name from a public config endpoint
        }
      } catch {}
    }

    fetchConfig();
    resetChatInactivityTimer(); // Start 15-min idle clear from page load

    // ── iOS Safari viewport height fix ────────────────────────
    // On iOS, 100vh includes the browser chrome. This fixes it.
    function fixViewportHeight() {
      document.documentElement.style.setProperty('--real-vh', window.innerHeight + 'px');
      document.body.style.height = window.innerHeight + 'px';
    }
    fixViewportHeight();
    window.addEventListener('resize', fixViewportHeight);
    window.addEventListener('orientationchange', () => {
      setTimeout(fixViewportHeight, 300);
    });
  </script>
</body>
</html>
