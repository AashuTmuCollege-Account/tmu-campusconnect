<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TMU CampusConnect – AI Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #3b82f6;
      --accent2: #8b5cf6;
      --bg: #0f172a;
      --bg2: #1e293b;
      --border: rgba(255,255,255,0.1);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --radius: 16px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: transparent;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Chat Header ── */
    .chat-header {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      padding: 14px 16px;
      display: flex; align-items: center; gap: 10px;
      border-radius: var(--radius) var(--radius) 0 0;
      flex-shrink: 0;
    }
    .header-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(255,255,255,0.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    .header-info { flex: 1; }
    .header-name { font-size: 14px; font-weight: 600; color: #fff; }
    .header-status {
      font-size: 11px; color: rgba(255,255,255,0.8);
      display: flex; align-items: center; gap: 4px;
    }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #4ade80; display: inline-block; }

    /* ── Messages Area ── */
    .chat-messages {
      flex: 1; overflow-y: auto;
      padding: 16px; display: flex; flex-direction: column; gap: 12px;
      background: var(--bg);
      scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.1) transparent;
    }
    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    /* ── Message Bubbles ── */
    .msg { display: flex; align-items: flex-end; gap: 8px; max-width: 88%; animation: msgIn 0.25s ease; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.bot  { align-self: flex-start; }
    @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .msg-avatar {
      width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 14px;
    }
    .bot .msg-avatar { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
    .user .msg-avatar { background: rgba(255,255,255,0.1); }

    .msg-bubble {
      padding: 10px 14px; border-radius: 14px;
      font-size: 13px; line-height: 1.55;
    }
    .bot .msg-bubble {
      background: var(--bg2);
      border: 1px solid var(--border);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }
    .user .msg-bubble {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg-sources {
      margin-top: 6px; font-size: 11px; color: var(--text-muted);
      font-style: italic;
    }

    /* Typing indicator */
    .typing-indicator { display: flex; gap: 4px; padding: 12px 14px; }
    .typing-dot {
      width: 7px; height: 7px; background: var(--text-muted);
      border-radius: 50%;
      animation: typing 1.2s ease-in-out infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing { 0%, 80%, 100% { transform: scale(0.7); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }

    /* ── Suggestions ── */
    .suggestions {
      padding: 8px 16px 0;
      display: flex; flex-wrap: wrap; gap: 6px;
      background: var(--bg); flex-shrink: 0;
    }
    .suggestion-chip {
      padding: 5px 12px;
      border: 1px solid rgba(59,130,246,0.3);
      border-radius: 20px; background: rgba(59,130,246,0.08);
      color: var(--accent); font-size: 12px; cursor: pointer;
      font-family: inherit; transition: all 0.2s;
    }
    .suggestion-chip:hover { background: rgba(59,130,246,0.2); }

    /* ── Input Bar ── */
    .chat-input-bar {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 14px;
      background: var(--bg2);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .chat-input {
      flex: 1; background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      border-radius: 24px; padding: 9px 16px;
      color: var(--text); font-size: 13px; font-family: inherit;
      outline: none; transition: border-color 0.2s;
      resize: none; max-height: 90px; overflow-y: auto;
    }
    .chat-input:focus { border-color: var(--accent); }
    .chat-input::placeholder { color: var(--text-muted); }
    .send-btn {
      width: 38px; height: 38px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none; cursor: pointer; font-size: 16px;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; flex-shrink: 0;
    }
    .send-btn:hover { opacity: 0.85; transform: scale(1.05); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    /* Welcome message */
    .welcome {
      text-align: center; padding: 20px 16px;
      color: var(--text-muted);
    }
    .welcome-icon { font-size: 40px; margin-bottom: 8px; }
    .welcome-title { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
    .welcome-sub { font-size: 12px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="chat-header">
    <div class="header-avatar">🎓</div>
    <div class="header-info">
      <div class="header-name" id="header-name">TMU CampusConnect</div>
      <div class="header-status"><span class="status-dot"></span> Online &amp; Ready</div>
    </div>
  </div>

  <div class="chat-messages" id="chat-messages">
    <div class="welcome">
      <div class="welcome-icon">🎓</div>
      <div class="welcome-title" id="welcome-title">Welcome to TMU CampusConnect!</div>
      <div class="welcome-sub">Your AI guide for Teerthanker Mahaveer University. Ask me about admissions, courses, fees, hostel, placements &amp; more!</div>
    </div>
  </div>

  <div class="suggestions" id="suggestions">
    <button class="suggestion-chip" data-q="What are the admission requirements?">Admissions</button>
    <button class="suggestion-chip" data-q="What courses are available?">Courses</button>
    <button class="suggestion-chip" data-q="What is the fee structure?">Fee Structure</button>
    <button class="suggestion-chip" data-q="Tell me about hostel facilities.">Hostel</button>
    <button class="suggestion-chip" data-q="How can I contact the admin office?">Contact</button>
  </div>

  <div class="chat-input-bar">
    <textarea class="chat-input" id="chat-input" placeholder="Ask about TMU admissions, courses, fees..." rows="1"></textarea>
    <button class="send-btn" id="send-btn" title="Send">➤</button>
  </div>

  <script>
    const API_URL = window.location.origin + '/api/chat';
    let sessionId = null;
    let isWaiting = false;

    const messagesEl = document.getElementById('chat-messages');
    const inputEl    = document.getElementById('chat-input');
    const sendBtn    = document.getElementById('send-btn');

    // Auto-resize textarea
    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 90) + 'px';
    });

    // Send on Enter (Shift+Enter for newline)
    inputEl.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
    sendBtn.addEventListener('click', sendMessage);

    // Suggestion chips
    document.querySelectorAll('.suggestion-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        inputEl.value = chip.dataset.q;
        sendMessage();
        document.getElementById('suggestions').style.display = 'none';
      });
    });

    function addMessage(role, text, sources = []) {
      const avatarEmoji = role === 'bot' ? '🎓' : '👤';
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.innerHTML = `
        <div class="msg-avatar">${avatarEmoji}</div>
        <div>
          <div class="msg-bubble">${text.replace(/\n/g, '<br>')}</div>
          ${sources.length ? `<div class="msg-sources">📎 Sources: ${sources.join(', ')}</div>` : ''}
        </div>`;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    function showTyping() {
      const div = document.createElement('div');
      div.className = 'msg bot'; div.id = 'typing';
      div.innerHTML = `<div class="msg-avatar">🎓</div>
        <div class="msg-bubble"><div class="typing-indicator">
          <div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>
        </div></div>`;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function removeTyping() {
      const t = document.getElementById('typing');
      if (t) t.remove();
    }

    async function sendMessage() {
      const question = inputEl.value.trim();
      if (!question || isWaiting) return;

      isWaiting = true;
      sendBtn.disabled = true;
      inputEl.value = '';
      inputEl.style.height = 'auto';
      document.getElementById('suggestions').style.display = 'none';

      addMessage('user', question);
      showTyping();

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question, session_id: sessionId })
        });

        if (!res.ok) throw new Error('Server error');
        const data = await res.json();
        sessionId = data.session_id;

        removeTyping();
        addMessage('bot', data.answer, data.sources || []);
      } catch (err) {
        removeTyping();
        addMessage('bot', '⚠️ I could not reach the server. Please try again in a moment.');
      } finally {
        isWaiting = false;
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    // Fetch university name from API and update header
    async function fetchConfig() {
      try {
        const res = await fetch(window.location.origin + '/api/health');
        if (res.ok) {
          // Could extend to fetch university name from a public config endpoint
        }
      } catch {}
    }

    fetchConfig();
  </script>
</body>
</html>
